name: Test and deploy production

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy-main
  cancel-in-progress: false

jobs:
  frontend:
    name: Frontend checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout trusted main revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install locked dependencies
        working-directory: frontend
        run: npm ci

      - name: Test and build frontend
        working-directory: frontend
        run: |
          set -euo pipefail
          npm test
          npm run build

  backend:
    name: Backend checks
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: okr_automation_test
          POSTGRES_USER: okr
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U okr -d okr_automation_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout trusted main revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run backend tests
        working-directory: backend
        env:
          OKR_DATABASE_URL: postgresql+psycopg://okr:ci-only-password@localhost:5432/okr_automation_test
          OKR_JWT_SECRET: ci-only-jwt-secret-not-used-in-production
        run: python -m pytest -q

  deploy:
    name: Deploy main to production
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs:
      - frontend
      - backend
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://xdk-pvcfc.com/
    steps:
      - name: Checkout the tested revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install pinned deploy dependency
        run: python -m pip install --disable-pip-version-check "paramiko==3.5.1"

      - name: Validate secrets and prepare SSH files
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_SSH_PRIVATE_KEY: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Missing VPS_HOST production secret}"
          : "${VPS_USER:?Missing VPS_USER production secret}"
          : "${VPS_SSH_PRIVATE_KEY:?Missing VPS_SSH_PRIVATE_KEY production secret}"
          : "${VPS_HOST_KEY:?Missing VPS_HOST_KEY production secret}"
          VPS_PORT="${VPS_PORT:-22}"

          umask 077
          key_file="${RUNNER_TEMP}/vps_deploy_key"
          known_hosts_file="${RUNNER_TEMP}/vps_known_hosts"
          printf '%s\n' "${VPS_SSH_PRIVATE_KEY}" | tr -d '\r' > "${key_file}"
          printf '%s\n' "${VPS_HOST_KEY}" | tr -d '\r' > "${known_hosts_file}"
          chmod 600 "${key_file}" "${known_hosts_file}"

          host_token="${VPS_HOST}"
          if [ "${VPS_PORT}" != "22" ]; then
            host_token="[${VPS_HOST}]:${VPS_PORT}"
          fi
          ssh-keygen -F "${host_token}" -f "${known_hosts_file}" >/dev/null || {
            echo "VPS_HOST_KEY does not contain an entry for ${host_token}." >&2
            exit 1
          }

          echo "VPS_SSH_KEY_PATH=${key_file}" >> "${GITHUB_ENV}"
          echo "VPS_KNOWN_HOSTS_PATH=${known_hosts_file}" >> "${GITHUB_ENV}"
          echo "SSH configuration validated for pinned host key."

      - name: Deploy verified archive
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_REMOTE_DIR: ${{ secrets.VPS_REMOTE_DIR }}
          VPS_SSH_KEY_PASSPHRASE: ${{ secrets.VPS_SSH_KEY_PASSPHRASE }}
        run: |
          set -euo pipefail
          python deploy_prod.py

      - name: Verify public health endpoint
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --retry 5 --retry-delay 5 --max-time 20 \
            https://xdk-pvcfc.com/health
          echo
          echo "Production health check passed."

      - name: Remove ephemeral SSH material
        if: always()
        run: |
          rm -f -- "${RUNNER_TEMP}/vps_deploy_key" "${RUNNER_TEMP}/vps_known_hosts"
