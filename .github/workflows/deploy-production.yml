name: CI and Production Deploy

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      import_bm01:
        description: "Import BM01 legacy rows during deploy"
        required: false
        type: boolean
        default: false
      reset_user_passwords:
        description: "Reset seeded user passwords during deploy"
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  frontend:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        run: npm run build

  backend:
    name: Backend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        working-directory: backend
        run: python -m pytest -q

  deploy:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs:
      - frontend
      - backend
    if: github.ref == 'refs/heads/main'
    environment:
      name: production
      url: http://103.200.20.225/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deploy dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install paramiko

      - name: Configure SSH known hosts
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Missing VPS_HOST secret}"
          VPS_PORT="${VPS_PORT:-22}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          if [ -n "${VPS_HOST_KEY}" ]; then
            printf '%s\n' "${VPS_HOST_KEY}" >> ~/.ssh/known_hosts
          else
            ssh-keyscan -p "${VPS_PORT}" "${VPS_HOST}" >> ~/.ssh/known_hosts
          fi
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_REMOTE_DIR: ${{ secrets.VPS_REMOTE_DIR }}
          IMPORT_BM01: ${{ github.event.inputs.import_bm01 || 'false' }}
          RESET_USER_PASSWORDS: ${{ github.event.inputs.reset_user_passwords || 'false' }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Missing VPS_HOST secret}"
          : "${VPS_PASSWORD:?Missing VPS_PASSWORD secret}"
          export VPS_PORT="${VPS_PORT:-22}"
          export VPS_USER="${VPS_USER:-root}"
          export VPS_REMOTE_DIR="${VPS_REMOTE_DIR:-/opt/okr-system}"

          deploy_args=()
          if [ "${IMPORT_BM01}" != "true" ]; then
            deploy_args+=(--skip-import-bm01)
          fi
          if [ "${RESET_USER_PASSWORDS}" != "true" ]; then
            deploy_args+=(--no-reset-user-passwords)
          fi

          python deploy_prod.py "${deploy_args[@]}"
