name: Bootstrap production deploy key

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy-key-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Install key using the legacy password once
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
    steps:
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Install pinned SSH dependency
        run: python -m pip install --disable-pip-version-check "paramiko==3.5.1"

      - name: Validate bootstrap secrets and pinned host identity
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_HOST_KEY: ${{ secrets.VPS_HOST_KEY }}
          VPS_SSH_PUBLIC_KEY: ${{ secrets.VPS_SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          : "${VPS_HOST:?Missing VPS_HOST production secret}"
          : "${VPS_USER:?Missing VPS_USER production secret}"
          : "${VPS_PASSWORD:?Missing VPS_PASSWORD production secret}"
          : "${VPS_HOST_KEY:?Missing VPS_HOST_KEY production secret}"
          : "${VPS_SSH_PUBLIC_KEY:?Missing VPS_SSH_PUBLIC_KEY production secret}"
          VPS_PORT="${VPS_PORT:-22}"

          umask 077
          known_hosts_file="${RUNNER_TEMP}/vps_bootstrap_known_hosts"
          printf '%s\n' "${VPS_HOST_KEY}" | tr -d '\r' > "${known_hosts_file}"
          chmod 600 "${known_hosts_file}"

          host_token="${VPS_HOST}"
          if [ "${VPS_PORT}" != "22" ]; then
            host_token="[${VPS_HOST}]:${VPS_PORT}"
          fi
          ssh-keygen -F "${host_token}" -f "${known_hosts_file}" >/dev/null || {
            echo "VPS_HOST_KEY does not contain an entry for ${host_token}." >&2
            exit 1
          }

          echo "VPS_BOOTSTRAP_KNOWN_HOSTS=${known_hosts_file}" >> "${GITHUB_ENV}"
          echo "Bootstrap secrets and pinned host identity validated."

      - name: Install the dedicated deploy public key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
          VPS_SSH_PUBLIC_KEY: ${{ secrets.VPS_SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          import shlex

          import paramiko


          host = os.environ["VPS_HOST"]
          port = int(os.environ.get("VPS_PORT") or "22")
          user = os.environ["VPS_USER"]
          password = os.environ["VPS_PASSWORD"]
          public_key = os.environ["VPS_SSH_PUBLIC_KEY"].strip()
          encoded_key = base64.b64encode(public_key.encode("utf-8")).decode("ascii")

          client = paramiko.SSHClient()
          client.load_host_keys(os.environ["VPS_BOOTSTRAP_KNOWN_HOSTS"])
          client.set_missing_host_key_policy(paramiko.RejectPolicy())
          client.connect(
              hostname=host,
              port=port,
              username=user,
              password=password,
              allow_agent=False,
              look_for_keys=False,
              timeout=15,
              auth_timeout=15,
              banner_timeout=15,
          )

          encoded = shlex.quote(encoded_key)
          command = f"""set -eu
          umask 077
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          touch "$HOME/.ssh/authorized_keys"
          chmod 600 "$HOME/.ssh/authorized_keys"
          key="$(printf '%s' {encoded} | base64 -d)"
          if ! grep -qxF -- "$key" "$HOME/.ssh/authorized_keys"; then
            printf '%s\\n' "$key" >> "$HOME/.ssh/authorized_keys"
          fi
          """
          _, stdout, stderr = client.exec_command(command, timeout=20)
          status = stdout.channel.recv_exit_status()
          error_text = stderr.read().decode("utf-8", errors="replace").strip()
          client.close()
          if status != 0:
              raise SystemExit(error_text or f"Remote bootstrap failed with status {status}")
          print("Dedicated deploy public key installed.")
          PY

      - name: Remove ephemeral host material
        if: always()
        run: rm -f -- "${RUNNER_TEMP}/vps_bootstrap_known_hosts"
